<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shree Guruji CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Pucho OS shell: sidebar + header (search centre, bell), account menu bottom-left. Graphite neutrals, one interactive colour (Pucho violet), colour only for status, hairlines not shadows. */
:root{
 --bg:#f7f7f9;--surface:#ffffff;--sunk:#f1f0f5;--ink:#17151f;--mut:#686577;--faint:#9895a6;--line:#e6e4ec;
 --brand:#5b21c6;--brand-ink:#ffffff;--brand-soft:#f1ebfd;--brand-line:#d9cbf7;
 --ok:#1f7a4a;--ok-soft:#e5f4ec;--warn:#9a5b0b;--warn-soft:#fbf0dc;--bad:#b42318;--bad-soft:#fdebe9;--info:#1d5fb4;--info-soft:#e7effb;--mute-soft:#efeef3;
 --scrim:rgba(18,16,26,.42);
 --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--f-login:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
 --r:8px;--t1:120ms;--t2:200ms;--t3:280ms;--ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f0e14;--surface:#16151d;--sunk:#1c1b24;--ink:#ecebf2;--mut:#a3a0b2;--faint:#76738a;--line:#2a2834;
 --brand:#a58bfa;--brand-ink:#14102a;--brand-soft:#241d3d;--brand-line:#3b2f66;
 --ok:#5fd09a;--ok-soft:#14291f;--warn:#f0b65a;--warn-soft:#2c2112;--bad:#ff8b80;--bad-soft:#331816;--info:#7fb0f5;--info-soft:#152238;--mute-soft:#22212b;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f0e14;--surface:#16151d;--sunk:#1c1b24;--ink:#ecebf2;--mut:#a3a0b2;--faint:#76738a;--line:#2a2834;
 --brand:#a58bfa;--brand-ink:#14102a;--brand-soft:#241d3d;--brand-line:#3b2f66;
 --ok:#5fd09a;--ok-soft:#14291f;--warn:#f0b65a;--warn-soft:#2c2112;--bad:#ff8b80;--bad-soft:#331816;--info:#7fb0f5;--info-soft:#152238;--mute-soft:#22212b;--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body,#root{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.3px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2}.brand small{color:var(--mut);font-size:12px}
.navs{flex:1;overflow:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:14px}
.grp>span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px 4px;font-weight:500}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:var(--r);color:var(--mut);cursor:pointer;text-align:left;font-weight:500;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.nv:hover{background:var(--sunk);color:var(--ink)}
.nv.on{background:var(--brand-soft);color:var(--brand)}
.nv svg{width:16px;height:16px;flex:none}
.nv .ct{margin-left:auto;font-size:12px;color:var(--faint)}.nv.on .ct{color:var(--brand)}
.acct{border-top:1px solid var(--line);padding:8px;position:relative}
.me{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:var(--r);cursor:pointer;text-align:left}
.me:hover{background:var(--sunk)}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut);flex:none}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}.me small{color:var(--mut);font-size:12px}
.menu{position:absolute;left:8px;right:8px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:30;animation:pop var(--t2) var(--ease)}
.menu button{display:flex;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;gap:8px;align-items:center}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .lbl{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px) minmax(0,1fr);align-items:center;gap:12px;height:56px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.hdr h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{display:flex;align-items:center;gap:8px;min-width:0}
.srch{position:relative}
.srch input{width:100%;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:0 10px 0 32px}
.srch input:focus{border-color:var(--brand-line);outline:none;background:var(--surface)}
.srch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
.hr{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ib{width:34px;height:34px;border:1px solid transparent;background:none;border-radius:var(--r);display:grid;place-items:center;cursor:pointer;color:var(--mut);position:relative}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib svg{width:18px;height:18px}
.dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.burger{display:none}
.content{flex:1;overflow:auto;padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.foot{font-size:12px;color:var(--faint);text-align:center;padding-top:8px}
.foot b{color:var(--mut);font-weight:600}

/* parts */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{font-size:14px;font-weight:600;margin:0}
.ph small{color:var(--mut)}
.pb{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;transition:border-color var(--t1) var(--ease)}
.kpi:hover{border-color:var(--brand-line)}
.kpi span{display:block;color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.kpi em{font-style:normal;font-size:12px;color:var(--brand)}
.kpi.alert b{color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px}
.bar span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:4px;transition:width var(--t3) var(--ease)}
.bar b{font-weight:500;text-align:right}
.queue{list-style:none;margin:0;padding:0}
.queue li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.queue li:first-child{border-top:0}
.queue li:hover{background:var(--sunk)}
.queue .q1{flex:1;min-width:0}.queue .q1 b{display:block;font-weight:500}.queue .q1 small{color:var(--mut)}

.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button i{font-style:normal;color:var(--faint);margin-left:4px}
.sel{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 8px;max-width:100%}
.sp{flex:1}
.btn{height:34px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity var(--t1)}
.btn:hover{opacity:.9}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--sunk);opacity:1}
.btn.sm{height:30px;padding:0 10px;font-size:13px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--mut);background:var(--surface);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background var(--t1)}
tbody tr:hover{background:var(--sunk)}
td small{display:block;color:var(--mut);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-info{background:var(--info-soft);color:var(--info)}.t-brand{background:var(--brand-soft);color:var(--brand)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-ok{background:var(--ok-soft);color:var(--ok)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-mute{background:var(--mute-soft);color:var(--mut)}
.cx{display:inline-flex;gap:6px}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--t1),border-color var(--t1)}
.cbtn svg{width:15px;height:15px;flex:none}
.cbtn.wa{color:var(--ok)}.cbtn.wa:hover{background:var(--ok-soft);border-color:var(--ok)}
.cbtn.call{color:var(--brand)}.cbtn.call:hover{background:var(--brand-soft);border-color:var(--brand-line)}
.cbtn.lg{height:36px;flex:1;padding:0 12px}
.conv{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ok)}
.conv::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
tr.won td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.crd.won{border-color:var(--ok)}
.type{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.colm{background:var(--sunk);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.colm h3{font-size:12px;font-weight:600;margin:4px 6px;display:flex;justify-content:space-between;color:var(--mut)}
.crd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;width:100%;transition:border-color var(--t1)}
.crd:hover{border-color:var(--brand-line)}
.crd b{display:block;font-weight:600}.crd small{color:var(--mut);display:block;margin-top:2px}
.crd .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade var(--t2) var(--ease)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;animation:slide var(--t3) var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dh{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dh h2{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 8px;cursor:pointer;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.db{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:500;color:var(--mut)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--brand)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;margin-left:3px}
.tl li::after{content:"";position:absolute;left:6px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl small{color:var(--mut);display:block}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:41;display:flex;flex-direction:column;animation:pop var(--t2) var(--ease)}
.modal .db{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .full{grid-column:1/-1}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:13px;animation:pop var(--t2) var(--ease);max-width:340px}

.note{background:var(--sunk);border-radius:var(--r);padding:10px 12px;color:var(--mut);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chips button{border:0;background:none;width:20px;height:20px;border-radius:50%;cursor:pointer;color:var(--faint)}
.chips button:hover{background:var(--bad-soft);color:var(--bad)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;background:var(--surface)}

.chat{display:flex;flex-direction:column;gap:8px;height:340px;overflow:auto;padding:14px;background:var(--sunk)}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.you{background:var(--brand);color:var(--brand-ink);align-self:flex-end;border-bottom-right-radius:4px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.cin input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;background:var(--surface)}
.rule{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.rule:first-child{border-top:0}
.rule svg{width:14px;height:14px;color:var(--faint);flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.perm td{cursor:default}
.perm tbody tr:hover{background:none}
.yes{color:var(--ok);font-weight:600}.no{color:var(--faint)}

/* reminders */
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dnav{display:inline-flex;align-items:center;gap:4px}
.dnav input[type=date]{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 8px;background:var(--surface)}
.ib.sm{width:32px;height:32px;border:1px solid var(--line)}
.ib.sm svg{width:16px;height:16px}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dhead h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.dhead small{color:var(--mut)}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rl li:first-child{border-top:0}
.rl input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
.rl .tm{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.rl .rt b{font-weight:500;display:block}
.rl .rt small{color:var(--mut);font-size:12px}
.rl .rt button{border:0;background:none;padding:0;color:var(--brand);cursor:pointer;font-size:12px}
.rl li.done .rt b{text-decoration:line-through;color:var(--faint)}
.rl li.late .tm{color:var(--bad)}
.rl .del{border:0;background:none;color:var(--faint);cursor:pointer;width:28px;height:28px;border-radius:6px}
.rl .del:hover{background:var(--bad-soft);color:var(--bad)}
.rform{display:flex;flex-direction:column;gap:12px}
.rform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lrem{display:flex;flex-direction:column;gap:6px}
.lrem div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}
@media (max-width:960px){.rg{grid-template-columns:1fr}}
@media (max-width:520px){.rl li{grid-template-columns:auto minmax(0,1fr) auto}.rl .tm{grid-column:2;grid-row:2;margin-top:-8px}.rl .rt{grid-column:2;grid-row:1}.rl .del{grid-column:3;grid-row:1}}

/* login */
.login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);z-index:80;font-family:var(--f-login);overflow:auto}
.lh{background:var(--brand);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-top:calc(48px + env(safe-area-inset-top,0px))}
:root[data-theme="dark"] .lh{color:var(--brand-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lh{color:var(--brand-ink)}}
.lh .mk{display:flex;align-items:center;gap:10px;font-weight:600}
.lh .mk span{width:34px;height:34px;border-radius:8px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px}
.lh h2{font-size:38px;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance;font-weight:600;max-width:15ch}
.lh p{margin:0;opacity:.85;max-width:44ch;font-size:15px}
.lh ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14px;opacity:.9}
.lh li::before{content:"—  "}
.lh .by{font-size:13px;opacity:.75}
.lf{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.lc{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.lc h3{font-size:24px;font-weight:600;margin:0}
.lc p{margin:0;color:var(--mut)}
.pers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pers button{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;cursor:pointer;text-align:left;font-family:var(--f-login)}
.pers button:first-child{border-top:0}
.pers button:hover{background:var(--brand-soft)}
.pers b{display:block;font-weight:600}.pers small{color:var(--mut)}
.pers svg{margin-left:auto;width:16px;height:16px;color:var(--faint)}
.lc .fine{font-size:12px;color:var(--faint)}

@media (max-width:960px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:transform var(--t3) var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 .side.open{transform:none}
 .burger{display:grid}
 .hdr{grid-template-columns:auto minmax(0,1fr) auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .hdr h1{display:none}
 .chip .tx{display:none}
 .chip{padding:3px 6px}
 .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
 .ptitle{display:block!important}
 .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .lh{padding:28px 20px;gap:16px}.lh h2{font-size:28px}.lh ul{display:none}
 .lf{padding:28px 16px}
}
@media (max-width:520px){.form,.modal .db{grid-template-columns:1fr}.bar{grid-template-columns:96px minmax(0,1fr) 24px}.kpi b{font-size:24px}}
.ptitle{display:none;font-size:18px;font-weight:600;margin:0}
</style>
</head>
<body>

<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<style>
.tbl td{white-space:nowrap}.tbl td.wr{white-space:normal;min-width:220px}
.stsel{border:0;border-radius:999px;padding:3px 24px 3px 10px;font-size:12px;font-weight:500;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.stsel option{background:var(--surface);color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fields div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fields b{display:block;font-weight:600;font-size:13px}.fields small{color:var(--mut);font-size:12px}
.gh{text-align:center;background:var(--brand-soft)!important;color:var(--brand)!important;font-weight:600!important;border-bottom:0!important;border-radius:8px 8px 0 0;text-transform:uppercase;letter-spacing:.06em;font-size:11px!important;padding:6px 14px!important}
thead tr:first-child th{border-bottom:0;padding-block:8px 0}
thead tr:first-child th:not(.gh){position:static}
th.gs,td.gs{border-left:1px solid var(--brand-line)}th.ge,td.ge{border-right:1px solid var(--brand-line)}
thead tr:nth-child(2) th.gs,thead tr:nth-child(2) th.ge,thead tr:nth-child(2) th:nth-child(n+2):nth-child(-n+6){background:var(--brand-soft);color:var(--brand)}
.stg{display:flex;flex-direction:column;gap:12px}
.stg h3{font-size:12px;font-weight:600;color:var(--mut);margin:0;text-transform:uppercase;letter-spacing:.06em}
.fx{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brand-line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--brand);background:var(--brand-soft)}
.brand{flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px 10px}
.brand .logo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;width:100%;justify-content:center}
.brand .logo img{height:47px;width:auto;display:block}
.brand>small{color:var(--mut);font-size:12px;padding-left:2px}
.lgcard{background:#fff;border-radius:14px;padding:10px 14px;align-self:flex-start;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.lgcard img{width:200px;height:auto;display:block}
@media (max-width:820px){.lgcard img{width:140px}}
.hlogo{display:none}
@media (max-width:820px){.hlogo{display:block;height:30px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}.hdr .srch{min-width:0}}
.rmk{max-width:220px;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .hint{font-size:12px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.purp{font-size:12px;color:var(--ink);white-space:nowrap}
</style>

function matchQ(r){if(!S.q)return true;return (r.n+' '+r.loc+' '+r.req+' '+r.ph+' '+r.rmk+' '+r.p).toLowerCase().includes(S.q.toLowerCase())}

const digits=r=>{let d=String(r.ph||'').replace(/\D/g,'');if(d.length==10)d='91'+d;return d};
const waUrl=r=>'https://wa.me/'+digits(r)+'?text='+encodeURIComponent('Namaste '+r.n+', this is Shree Guruji regarding '+(isC(r)?'your complaint: ':r.p.indexOf('Job')==0?'your job application: ':'your enquiry: ')+r.req+'.');
const telUrl=r=>'tel:+'+digits(r);
function contact(r,big){if(!digits(r))return '<small style="color:var(--faint)">No phone</small>';const c=big?' lg':'';
 return '<span class="cx"'+(big?' style="display:flex;width:100%"':'')+'><a class="cbtn wa'+c+'" href="'+waUrl(r)+'" target="_blank" rel="noopener" title="WhatsApp '+esc(r.ph)+'" aria-label="WhatsApp '+esc(r.n)+'" onclick="event.stopPropagation();logC('+r.id+',\'WhatsApp chat opened\')">'+ic('wa')+(big?'WhatsApp':'')+'</a><a class="cbtn call'+c+'" href="'+telUrl(r)+'" title="Call '+esc(r.ph)+'" aria-label="Call '+esc(r.n)+'" onclick="event.stopPropagation();logC('+r.id+',\'Call started from CRM\')">'+ic('phone')+(big?'Call':'')+'</a></span>'}
function logC(id,m){S.rows.find(x=>x.id==id).log.push({t:Date.now(),m})}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
function go(p,seg){S.page=p;S.seg=seg||'all';S.src='';S.typ='';S.pur='';S.side=false;S.menu=false;R();const c=$('.content');if(c)c.scrollTop=0}

const PAGES=[
 {g:'Work',items:[['home','Overview','home'],['leads','Leads','leads'],['comp','Complaints','comp'],['rem','Reminders','cal']]},
 {g:'Admin',admin:true,items:[['set','Setup','set'],['users','Users & roles','users']]}];
const TITLE={home:'Overview',leads:'Leads',comp:'Complaints',rem:'Reminders',set:'Setup',users:'Users & roles',prof:'Profile & settings'};
function myRem(){return S.rem.filter(x=>admin()||x.as==S.me)}

function R(){
 const root=$('#root');
 if(!S.me){root.innerHTML=Login();return}
 if(!admin()&&(S.page=='set'||S.page=='users'))S.page='home';
 const M=mine(),cntL=M.filter(r=>!isC(r)&&isOpenSt(r)).length,cntC=M.filter(openC).length,cntR=myRem().filter(x=>x.date==TODAY&&!x.done).length,alerts=M.filter(r=>noReply(r)||(isC(r)&&r.st=='Open')).length;
 const cnt={leads:cntL,comp:cntC,rem:cntR};
 const nav=PAGES.filter(g=>!g.admin||admin()).map(g=>'<div class="grp"><span>'+g.g+'</span>'+g.items.map(([k,l,i])=>'<button class="nv'+(S.page==k?' on':'')+'" onclick="go(\''+k+'\')">'+ic(i)+l+(k in cnt?'<span class="ct num">'+cnt[k]+'</span>':'')+'</button>').join('')+'</div>').join('');
 const me=role(S.me),dark=isDark();
 root.innerHTML='<div class="app">'
 +(S.side?'<div class="scrim" style="z-index:49" onclick="S.side=false;R()"></div>':'')
 +'<aside class="side'+(S.side?' open':'')+'"><div class="brand"><div class="logo"><img src="'+LOGO_MARK+'" alt="Shree Guruji, since 1965" width="120" height="47"></div><small>Lead &amp; complaint CRM</small></div><nav class="navs" aria-label="Main">'+nav+'</nav>'
 +'<div class="acct">'+(S.menu?Menu():'')+'<button class="me" onclick="S.menu=!S.menu;R()" aria-haspopup="menu" aria-expanded="'+S.menu+'"><div class="av">'+me.ini+'</div><div style="min-width:0"><b>'+esc(me.short)+'</b><small>Demo persona</small></div></button></div></aside>'
 +'<div class="main"><header class="hdr"><div class="hl"><button class="ib burger" aria-label="Open menu" onclick="S.side=true;R()">'+ic('menu')+'</button><img class="hlogo" src="'+LOGO_MARK+'" alt="Shree Guruji"><h1>'+TITLE[S.page]+'</h1></div>'
 +'<div class="srch">'+ic('search')+'<input id="q" type="search" placeholder="Search name, city, phone, remarks" value="'+esc(S.q)+'" oninput="S.q=this.value;if(S.page!=\'leads\'&&S.page!=\'comp\')S.page=\'leads\';R();const e=$(\'#q\');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>'
 +'<div class="hr">'
 +'<button class="ib" aria-label="Switch theme" onclick="toggleTheme()">'+ic(dark?'sun':'moon')+'</button>'
 +'<button class="ib" aria-label="Alerts: '+alerts+'" onclick="go(\'comp\',\'attn\')">'+ic('bell')+(alerts?'<span class="dot num">'+alerts+'</span>':'')+'</button></div></header>'
 +'<div class="content"><div class="wrap"><h1 class="ptitle">'+TITLE[S.page]+'</h1>'+({home:Home,leads:Leads,comp:Comp,rem:Rem,set:Setup,users:Users,prof:Prof})[S.page]()+'<div class="foot">Built on <b>Pucho</b> · pucho.ai</div></div></div></div></div>'
 +(S.open?Drawer(S.rows.find(r=>r.id==S.open)):'')+(S.modal=='add'?AddModal():'');
}
function Menu(){return '<div class="menu" role="menu"><button onclick="go(\'prof\')">Profile &amp; settings</button><button onclick="toggleTheme();S.menu=false;R()">'+(isDark()?'Light':'Dark')+' theme</button><hr><div class="lbl">Switch demo persona</div>'+ROLES.map(r=>'<button onclick="S.me=\''+r.id+'\';S.menu=false;S.open=null;go(\'home\');toast(\'Signed in as '+r.short+'\')">'+(r.id==S.me?'● ':'')+esc(r.short)+'</button>').join('')+'<hr><button onclick="S.me=null;S.menu=false;S.open=null;R()">Sign out</button></div>'}
function isDark(){const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function toggleTheme(){document.documentElement.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('sg-theme',document.documentElement.dataset.theme)}catch(e){}R()}
try{const t=localStorage.getItem('sg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

function bars(items){const m=Math.max(1,...items.map(i=>i[1]));return '<div class="bars">'+items.map(i=>'<div class="bar"><span title="'+esc(i[0])+'">'+esc(i[0])+'</span><i><u style="width:'+(i[1]/m*100)+'%"></u></i><b class="num">'+i[1]+'</b></div>').join('')+'</div>'}
function Home(){
 const M=mine(),L=M.filter(r=>!isC(r)),C=M.filter(isC),SL=M.filter(isSales),cv=SL.filter(isConv).length;
 const k=[['Open enquiries',L.filter(isOpenSt).length,"go('leads','active')",'',''],['Converted',cv,"go('leads','conv')",'',SL.length?Math.round(cv/SL.length*100)+'% of sales enquiries':''],['Open complaints',C.filter(openC).length,"go('comp','active')",C.filter(openC).length?'alert':'',''],['Closed, customer not told',C.filter(noReply).length,"go('comp','attn')",C.filter(noReply).length?'alert':'','']];
 const q=M.filter(r=>r.st=='Open'||noReply(r)).sort((a,b)=>a.at.localeCompare(b.at)).slice(0,6);
 return '<div class="kpis">'+k.map(x=>'<button class="kpi '+x[3]+'" onclick="'+x[2]+'"><span>'+x[0]+(x[4]?' <small class="num" style="color:var(--ok)">· '+x[4]+'</small>':'')+'</span><b class="num">'+x[1]+'</b><em>Open list →</em></button>').join('')+'</div>'
 +'<div class="g2"><section class="panel"><div class="ph"><h2>Enquiries by source</h2><small>'+M.length+' total</small></div><div class="pb">'+bars(S.sources.map(s=>[shortSrc(s),M.filter(r=>r.src==s).length]))+'</div></section>'
 +'<section class="panel"><div class="ph"><h2>Enquiries by purpose</h2><small>'+M.filter(isOpenSt).length+' open</small></div><div class="pb">'+bars(S.purposes.map(p=>[shortPur(p),M.filter(r=>r.p==p).length]))+'</div></section></div>'
 +'<section class="panel"><div class="ph"><h2>Needs action</h2><small>Oldest first</small></div>'+(q.length?'<ul class="queue">'+q.map(r=>'<li onclick="openRow('+r.id+')"><div class="q1"><b>'+esc(r.n)+'</b><small>'+esc(shortPur(r.p))+' · '+esc(r.req)+' · '+esc(r.loc)+'</small></div>'+(noReply(r)?'<span class="badge t-bad">Customer not told</span>':badge(r.st))+'<span class="num" style="color:var(--mut);font-size:12px;width:34px;text-align:right">'+age(r)+'d</span></li>').join('')+'</ul>':'<div class="empty"><b>Nothing waiting</b>New enquiries and unanswered complaints show here.</div>')+'</section>'

function segs(list,arr){return '<div class="seg" role="tablist">'+arr.map(([k,l])=>'<button class="'+(S.seg==k?'on':'')+'" onclick="S.seg=\''+k+'\';R()">'+l+'<i class="num">'+list.filter(segFn(k)).length+'</i></button>').join('')+'</div>'}
const srcSel=()=>'<select id="f_src" class="sel" aria-label="Source" onchange="S.src=this.value;R()"><option value="">All sources</option>'+opts(S.sources,S.src)+'</select>';
const typSel=()=>'<select id="f_typ" class="sel" aria-label="Lead type" onchange="S.typ=this.value;R()"><option value="">All types</option>'+opts(S.types,S.typ)+'</select>';

const stageHead='<th class="gs">Stage</th><th>Enquiry Received Date</th><th>Enquiry Handler / Assigned To</th><th>Resolution Date</th><th class="ge">Remarks</th>';
const stageCells=(r,x)=>'<td class="gs" onclick="event.stopPropagation()">'+stageSel(r)+(x||'')+'</td><td class="num">'+shortDate(r.at)+'</td><td>'+esc(role(r.as).short)+'</td><td class="num">'+(r.res?shortDate(r.res):'<span style="color:var(--faint)">—</span>')+'</td><td class="ge"><div class="rmk" title="'+esc(r.rmk)+'">'+(esc(r.rmk)||'<span style="color:var(--faint)">—</span>')+'</div></td>';
const dateCells=r=>'<td class="num">'+shortDate(r.at)+'</td><td class="num">'+(r.res?shortDate(r.res):'<span style="color:var(--faint)">—</span>')+'</td>';

function Leads(){
 const all=mine().filter(r=>!isC(r)&&matchQ(r)&&(!S.src||r.src==S.src)&&(!S.typ||r.t==S.typ)&&(!S.pur||r.p==S.pur));
 const L=all.filter(segFn(S.seg)).sort((a,b)=>b.at.localeCompare(a.at));
 let h='<div class="bar2">'+segs(all,[['all','All'],['Open','Open'],['In Progress','In Progress'],['Closed','Closed'],['Rejected / Not Relevant','Rejected'],['conv','Converted']])
 +srcSel()+typSel()+'<select id="f_pur" class="sel" aria-label="Purpose" onchange="S.pur=this.value;R()"><option value="">All purposes</option>'+opts(S.purposes.filter(p=>p!='Complaint'),S.pur)+'</select><span class="sp"></span>'
 +'<div class="seg"><button class="'+(S.view=='table'?'on':'')+'" onclick="S.view=\'table\';R()">Table</button><button class="'+(S.view=='board'?'on':'')+'" onclick="S.view=\'board\';R()">Board</button></div>'
 +'<button class="btn" onclick="S.modal=\'add\';S.addP=\'New Business Enquiry\';R()">'+icS('plus')+'Add enquiry</button></div>';
 if(S.view=='board')return h+'<div class="board">'+S.stages.map(s=>{const c=all.filter(r=>r.st==s);return '<div class="colm"><h3><span>'+esc(s=='Closed'?'Closed · Converted':s)+'</span><span class="num">'+c.length+'</span></h3>'+c.map(r=>'<div class="crd'+(isConv(r)?' won':'')+'" role="button" tabindex="0" onclick="openRow('+r.id+')" onkeydown="if(event.key==\'Enter\')openRow('+r.id+')"><b>'+esc(r.n)+'</b><small>'+esc(r.req)+'</small>'+(isConv(r)?'<div style="margin-top:6px">'+conv(r)+'</div>':'')+'<div class="row"><span class="type">'+esc(r.t)+'</span><small>'+esc(shortPur(r.p))+'</small></div><div class="row">'+contact(r)+'<small>'+esc(role(r.as).short)+'</small></div></div>').join('')+'</div>'}).join('')+'</div>';
 return h+'<section class="panel tbl">'+(L.length?'<table style="min-width:1320px"><thead><tr><th></th>'+GH+'<th colspan="4"></th></tr><tr><th>Lead</th>'+stageHead+'<th>Contact</th><th>Type</th><th>Purpose</th><th>Source</th></tr></thead><tbody>'+L.map(r=>'<tr class="'+(isConv(r)?'won':'')+'" onclick="openRow('+r.id+')"><td><b style="font-weight:500">'+esc(r.n)+'</b><small class="num">'+[esc(r.ph),esc(r.loc)].filter(Boolean).join(' · ')+'</small></td>'+stageCells(r,isConv(r)?'<div style="margin-top:4px">'+conv(r)+'</div>':'')+'<td>'+contact(r)+'</td><td><span class="type">'+esc(r.t)+'</span></td><td class="purp">'+esc(shortPur(r.p))+'</td><td>'+esc(shortSrc(r.src))+'</td></tr>').join('')+'</tbody></table>'
  :empty(S.seg=='conv'?'No converted leads yet':'No enquiries match',S.seg=='conv'?'Distributorship and new business enquiries you close show here as converted.':'Clear the search or pick another stage.'))+'</section>';
}

 const all=mine().filter(r=>isC(r)&&matchQ(r)&&(!S.src||r.src==S.src)&&(!S.typ||r.t==S.typ));
 const L=all.filter(segFn(S.seg)).sort((a,b)=>b.at.localeCompare(a.at));
 return '<div class="bar2">'+segs(all,[['all','All'],['Open','Open'],['In Progress','In Progress'],['attn','Customer not told'],['Closed','Closed'],['Rejected / Not Relevant','Rejected']])+srcSel()+typSel()+'<span class="sp"></span><button class="btn" onclick="S.modal=\'add\';S.addP=\'Complaint\';R()">'+icS('plus')+'Log complaint</button></div>'
 +'<section class="panel tbl">'+(L.length?'<table style="min-width:1440px"><thead><tr><th></th>'+GH+'<th colspan="5"></th></tr><tr><th>Complainant</th>'+stageHead+'<th>Customer told</th><th>Contact</th><th>Issue</th><th>Type</th><th>Source</th></tr></thead><tbody>'+L.map(r=>'<tr onclick="openRow('+r.id+')"><td><b style="font-weight:500">'+esc(r.n)+'</b><small>'+(r.loc?esc(r.loc)+' · ':'')+age(r)+' d</small></td>'+stageCells(r)+'<td>'+(r.resp?'<span class="badge t-ok">Yes</span>':'<span class="badge '+(noReply(r)?'t-bad':'t-mute')+'">Not yet</span>')+'</td><td>'+contact(r)+'</td><td class="wr">'+esc(r.req)+'</td><td><span class="type">'+esc(r.t)+'</span></td><td>'+esc(shortSrc(r.src))+'</td></tr>').join('')+'</tbody></table>'

 const lr=S.rem.filter(x=>x.lead==r.id&&!x.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

 +'<div class="two"><div class="fld"><label for="d_st">Stage</label><select id="d_st" onchange="upd('+r.id+',\'st\',this.value)">'+opts(S.stages,r.st)+'</select></div>'
 +'<div class="fld"><label for="d_as">Assigned to</label><select id="d_as" onchange="upd('+r.id+',\'as\',this.value)">'+ROLES.map(u=>'<option value="'+u.id+'"'+(u.id==r.as?' selected':'')+'>'+esc(u.short)+'</option>').join('')+'</select></div></div>'
 +'<div class="two"><div class="fld"><label for="d_at">Enquiry received</label><input type="date" id="d_at" value="'+r.at+'" max="'+TODAY+'" onchange="upd('+r.id+',\'at\',this.value)"></div>'
 +'<div class="fld"><label for="d_res">Resolution date</label><input type="date" id="d_res" value="'+(r.res||'')+'" min="'+r.at+'" onchange="upd('+r.id+',\'res\',this.value||null)">'+(r.res?'':'<span class="hint">Filled in when closed or rejected</span>')+'</div></div>'
 +(c?'<label class="chk"><input id="d_resp" type="checkbox" '+(r.resp?'checked':'')+' onchange="upd('+r.id+',\'resp\',this.checked)"><span><b style="font-weight:500">Customer has been told</b><br><small style="color:var(--mut)">Tick once the handler has replied to the customer.</small></span></label>':'')
 +'<div class="fld"><label for="d_rmk">Remarks</label><textarea id="d_rmk" rows="3" placeholder="Outcome, next step or reason for rejection" onchange="upd('+r.id+',\'rmk\',this.value.trim())">'+esc(r.rmk)+'</textarea><span class="hint">Saved when you click away.</span></div>'
 +'<div class="fld"><label>Reminders</label><div class="lrem">'+(lr.length?lr.map(x=>'<div><span>'+esc(x.title)+'</span><span class="num" style="color:'+(x.date<TODAY?'var(--bad)':'var(--mut)')+';white-space:nowrap">'+(relDay(x.date)||shortDate(x.date))+(x.time?' · '+t12(x.time):'')+'</span></div>').join(''):'<small style="color:var(--mut)">No open reminders.</small>')+'</div><div><button class="btn sec sm" onclick="remFor('+r.id+')">'+icS('cal',15)+'Set reminder</button></div></div>'
 :'<div class="fld"><label for="nt">Add a note</label><textarea id="nt" rows="3" placeholder="What happened on the call?"></textarea></div><div><button class="btn sm" onclick="note('+r.id+')">Save note</button></div><ul class="tl">'+r.log.slice().reverse().map(x=>'<li><div>'+esc(x.m)+'<small class="num">'+fdt(x.t)+'</small></div></li>').join('')+'</ul>';

 +'<div class="tabs" role="tablist"><button class="'+(S.tab=='details'?'on':'')+'" onclick="S.tab=\'details\';R()">Details</button><button class="'+(S.tab=='act'?'on':'')+'" onclick="S.tab=\'act\';R()">Activity · '+r.log.length+'</button></div><div class="db">'+body+'</div></aside>';
}
function upd(id,k,v){const r=S.rows.find(x=>x.id==id);const was=r[k];if(was===v)return;r[k]=v;let m,t;
 if(k=='st'){m='Stage changed to '+v;t='Stage updated';
  if(isDone(r)&&!r.res)r.res=TODAY;if(!isDone(r))r.res=null;
  if(isConv(r)){m='Lead converted';t='Lead converted'}}
 else if(k=='as'){m='Assigned to '+role(v).n;t='Reassigned to '+role(v).short}
 else if(k=='at'){if(!v){r.at=was;R();return}m='Received date set to '+shortDate(v);t='Received date saved';if(r.res&&r.res<v)r.res=v}
 else if(k=='res'){m=v?'Resolution date set to '+shortDate(v):'Resolution date cleared';t='Resolution date saved'}
 else if(k=='rmk'){m='Remarks: '+(v||'cleared');t='Remarks saved'}
 else{m=v?'Marked: customer told':'Unmarked: customer told';t='Saved'}
 r.log.push({t:Date.now(),m});toast(t);if(k=='as'&&!admin()&&v!=S.me)S.open=null;R()}
function note(id){const v=$('#nt').value.trim();if(!v){toast('Write a note first');return}S.rows.find(x=>x.id==id).log.push({t:Date.now(),m:'Note: '+v});toast('Note saved');R()}

function closeAdd(){S.modal=null;S.addP=null;R()}
function add(){const n=$('#a_n').value.trim();if(!n){toast('Enter a name to save');$('#a_n').focus();return}
 const p=$('#a_pu').value;mk({n,ph:$('#a_p').value.trim(),src:$('#a_s').value,t:$('#a_t').value,p,loc:$('#a_l').value.trim(),req:$('#a_r').value.trim(),st:'Open',at:$('#a_d').value||TODAY,as:$('#a_a').value,rmk:$('#a_m').value.trim()});
 S.modal=null;S.addP=null;toast((p=='Complaint'?'Complaint':'Enquiry')+' saved');R()}

// Reminders
function remFor(id){S.remLead=String(id);S.open=null;S.page='rem';R();const t=$('#r_title');if(t)t.focus()}
function setDay(s){if(!s)return;S.rdate=s;S.rmode='day';R()}
function Rem(){
 const M=myRem(),late=M.filter(x=>!x.done&&x.date<TODAY);
 const list=(S.rmode=='late'?late:S.rmode=='week'?M.filter(x=>x.date>=TODAY&&x.date<=shift(TODAY,6)):M.filter(x=>x.date==S.rdate)).slice().sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
 const open=list.filter(x=>!x.done).length;
 const head=S.rmode=='late'?['Overdue','Open reminders from earlier days']:S.rmode=='week'?['Next 7 days',shortDate(TODAY)+' to '+shortDate(shift(TODAY,6))]:[(relDay(S.rdate)?relDay(S.rdate)+', ':'')+longDate(S.rdate),''];
 const sb=(l,on,fn)=>'<button class="'+(on?'on':'')+'" onclick="'+fn+'">'+l+'</button>';
 return '<div class="dbar"><div class="seg">'
 +sb('Yesterday',S.rmode=='day'&&S.rdate==shift(TODAY,-1),"setDay('"+shift(TODAY,-1)+"')")
 +sb('Today',S.rmode=='day'&&S.rdate==TODAY,"setDay('"+TODAY+"')")
 +sb('Tomorrow',S.rmode=='day'&&S.rdate==shift(TODAY,1),"setDay('"+shift(TODAY,1)+"')")
 +sb('Next 7 days',S.rmode=='week',"S.rmode='week';R()")
 +'<button class="'+(S.rmode=='late'?'on':'')+'" onclick="S.rmode=\'late\';R()">Overdue<i class="num" style="'+(late.length?'color:var(--bad)':'')+'">'+late.length+'</i></button></div>'
 +'<div class="dnav"><button class="ib sm" aria-label="Previous day" onclick="setDay(shift(S.rdate,-1))">'+ic('left')+'</button><input type="date" id="r_pick" aria-label="Pick a date" value="'+S.rdate+'" onchange="setDay(this.value)"><button class="ib sm" aria-label="Next day" onclick="setDay(shift(S.rdate,1))">'+ic('arrow')+'</button></div></div>'
 +'<div class="rg"><section class="panel"><div class="ph"><div class="dhead" style="flex:1"><h2>'+esc(head[0])+'</h2><small class="num">'+(head[1]?esc(head[1])+' · ':'')+open+' open'+(list.length-open?' · '+(list.length-open)+' done':'')+'</small></div></div>'
 +(list.length?'<ul class="rl">'+list.map(x=>{const L=x.lead?S.rows.find(r=>r.id==x.lead):null;const lt=!x.done&&x.date<TODAY;
   return '<li class="'+(x.done?'done':'')+(lt?' late':'')+'"><input type="checkbox" id="rc'+x.id+'" aria-label="Mark done" '+(x.done?'checked':'')+' onchange="remDone('+x.id+',this.checked)"><span class="tm num">'+(S.rmode=='day'?t12(x.time):shortDate(x.date))+'</span><div class="rt"><b>'+esc(x.title)+'</b><small>'+(L?'<button onclick="openRow('+L.id+')">'+esc(L.n)+'</button> · ':'')+(S.rmode!='day'&&x.time?t12(x.time)+' · ':'')+esc(role(x.as).short)+'</small></div><button class="del" aria-label="Delete reminder" onclick="remDel('+x.id+')">✕</button></li>'}).join('')+'</ul>'
   :empty(S.rmode=='late'?'Nothing overdue':'No reminders '+(S.rmode=='week'?'this week':'on this day'),'Add one with the New reminder form.'))+'</section>'
 +'<section class="panel"><div class="ph"><h2>New reminder</h2></div><div class="pb rform">'
 +'<div class="fld"><label for="r_title">What to do</label><input id="r_title" placeholder="e.g. Call back about rate card" onkeydown="if(event.key==\'Enter\')addRem()"></div>'
 +'<div class="two"><div class="fld"><label for="r_date">Date</label><input type="date" id="r_date" value="'+(S.rmode=='day'?S.rdate:TODAY)+'"></div><div class="fld"><label for="r_time">Time</label><input type="time" id="r_time" value="10:00"></div></div>'
 +'<div class="fld"><label for="r_lead">Lead or complaint</label><select id="r_lead"><option value="">None</option>'+mine().map(r=>'<option value="'+r.id+'"'+(String(r.id)==S.remLead?' selected':'')+'>'+esc(r.n)+' · '+esc(shortPur(r.p))+'</option>').join('')+'</select></div>'
 +(admin()?'<div class="fld"><label for="r_as">For</label><select id="r_as">'+ROLES.map(u=>'<option value="'+u.id+'"'+(u.id=='admin'?' selected':'')+'>'+esc(u.n)+'</option>').join('')+'</select><span class="hint">Linked to a lead and left on Admin, it goes to the lead’s handler.</span></div>':'')
 +'<button class="btn" onclick="addRem()">'+icS('plus')+'Add reminder</button></div></section></div>'}
function addRem(){const t=$('#r_title').value.trim();if(!t){toast('Write what to do first');$('#r_title').focus();return}
 const d=$('#r_date').value||TODAY,lead=$('#r_lead').value?Number($('#r_lead').value):null;
 let as=admin()?$('#r_as').value:S.me;if(admin()&&lead&&as=='admin')as=S.rows.find(r=>r.id==lead).as;
 mkRem(t,d,$('#r_time').value,lead,as);if(lead)S.rows.find(r=>r.id==lead).log.push({t:Date.now(),m:'Reminder set for '+shortDate(d)+': '+t});
 S.remLead='';S.rdate=d;S.rmode='day';toast('Reminder added for '+(relDay(d)||shortDate(d)));R()}
function remDone(id,v){S.rem.find(r=>r.id==id).done=v;toast(v?'Marked done':'Reopened');R()}
function remDel(id){S.rem=S.rem.filter(r=>r.id!=id);toast('Reminder deleted');R()}

// Admin
function chips(k,label,hint){return '<section class="panel"><div class="ph"><h2>'+label+'</h2><small class="num">'+S[k].length+'</small></div><div class="pb"><p style="margin:0 0 10px;color:var(--mut);font-size:13px">'+hint+'</p><div class="chips">'+S[k].map((x,i)=>'<span>'+esc(x)+'<button aria-label="Remove '+esc(x)+'" onclick="delv(\''+k+'\','+i+')">✕</button></span>').join('')+'</div><div class="addrow"><input id="n_'+k+'" placeholder="Add a value" onkeydown="if(event.key==\'Enter\')addv(\''+k+'\')"><button class="btn sec sm" onclick="addv(\''+k+'\')">Add</button></div></div></section>'}
function addv(k){const v=$('#n_'+k).value.trim();if(v&&!S[k].includes(v)){S[k].push(v);toast('Added '+v);R()}}
function delv(k,i){const v=S[k][i];if(S.rows.some(r=>(k=='sources'&&r.src==v)||(k=='types'&&r.t==v)||(k=='purposes'&&r.p==v)||(k=='stages'&&r.st==v))){toast('“'+v+'” is used by existing enquiries, so it stays');return}S[k].splice(i,1);toast('Removed');R()}
function Setup(){return '<div class="note">These are the lists Shree Guruji shared for lead tracking. Every enquiry also records its received date, handler, resolution date and remarks.</div><div class="g2">'
 +chips('sources','Lead sources','Where enquiries are received from.')+chips('types','Lead types','Who is making the enquiry.')+chips('purposes','Enquiry purpose','What the enquiry is about.')+'</div><section class="panel"><div class="ph"><h2>Lead stages</h2><small class="num">8 items</small></div><div class="pb stg"><p style="margin:0;color:var(--mut);font-size:13px">As shared by Shree Guruji. Change the stage from the Leads or Complaints table, or in the enquiry drawer. Closed and Rejected fill in the resolution date.</p><h3>Stage</h3><div class="chips">'+S.stages.map((x,i)=>'<span>'+esc(x)+'<button aria-label="Remove '+esc(x)+'" onclick="delv(\'stages\','+i+')">✕</button></span>').join('')+'</div><div class="addrow" style="margin-top:0"><input id="n_stages" placeholder="Add a stage" onkeydown="if(event.key==\'Enter\')addv(\'stages\')"><button class="btn sec sm" onclick="addv(\'stages\')">Add</button></div><h3>Recorded with every stage</h3><div class="chips">'+['Enquiry Received Date','Enquiry Handler / Assigned To','Resolution Date','Remarks'].map(x=>'<span class="fx">'+x+'</span>').join('')+'</div></div></section>'}
function Users(){
 const pages=[['Overview',1,1,1,1,1],['Leads',1,1,1,1,1],['Complaints',1,1,1,1,1],['Reminders',1,1,1,1,1],['Setup',1,0,0,0,0],['Users & roles',1,0,0,0,0]];
 return '<section class="panel tbl"><div class="ph"><h2>People</h2><button class="btn sm" onclick="toast(\'Invites go out once sign-in is live\')">Invite person</button></div><table><thead><tr><th>Name</th><th>Role</th><th>Handles</th><th>Open items</th><th>Status</th></tr></thead><tbody>'
 +ROLES.map(r=>'<tr onclick="S.me=\''+r.id+'\';go(\'home\');toast(\'Viewing as '+r.short+'\')"><td><div style="display:flex;gap:10px;align-items:center"><div class="av">'+r.ini+'</div><div><b style="font-weight:500">'+esc(r.short)+' (demo)</b><small>'+r.id+'@shreeguruji.demo</small></div></div></td><td>'+esc(r.n)+'</td><td style="color:var(--mut)">'+esc(r.d)+'</td><td class="num">'+S.rows.filter(x=>(r.id=='admin'||x.as==r.id)&&isOpenSt(x)).length+'</td><td><span class="badge t-ok">Active</span></td></tr>').join('')+'</tbody></table></section>'
 +'<section class="panel tbl perm"><div class="ph"><h2>Page access by role</h2><small>Rows are always limited to what is assigned</small></div><table><thead><tr><th>Page</th>'+ROLES.map(r=>'<th>'+esc(r.short)+'</th>').join('')+'</tr></thead><tbody>'+pages.map(p=>'<tr><td>'+p[0]+'</td>'+p.slice(1).map(v=>'<td>'+(v?'<span class="yes">✓</span>':'<span class="no">—</span>')+'</td>').join('')+'</tr>').join('')+'</tbody></table></section>'
 +'<div class="note">Click a person to see the CRM as they do.</div>'}
function Prof(){const me=role(S.me);
 return '<section class="panel" style="max-width:560px"><div class="ph"><h2>Profile</h2></div><div class="pb" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:44px;height:44px">'+me.ini+'</div><div><b>'+esc(me.short)+' (demo)</b><div style="color:var(--mut);font-size:13px">'+esc(me.n)+'</div></div></div>'
 +'<div class="fld"><label for="p_lang">Language for labels</label><select id="p_lang" onchange="S.lang=this.value;toast(\'Hindi and Gujarati labels come with the full build\')">'+opts(['English','हिन्दी','ગુજરાતી'],S.lang)+'</select></div>'
 +'<div class="fld"><label>Theme</label><div class="seg"><button class="'+(!isDark()?'on':'')+'" onclick="document.documentElement.dataset.theme=\'light\';R()">Light</button><button class="'+(isDark()?'on':'')+'" onclick="document.documentElement.dataset.theme=\'dark\';R()">Dark</button></div></div></div></section>'}

function Login(){return '<div class="login"><div class="lh"><div class="lgcard"><img src="'+LOGO_FULL+'" alt="Shree Guruji, Swad bhi Sehat bhi" width="200" height="167"></div><div><h2>Every enquiry and complaint in one place.</h2><p>From the website, Outlook email and phone calls. Assigned, followed up and closed.</p><ul><li>Each team sees only what is assigned to them</li><li>Received and resolution dates on every enquiry</li><li>One-tap WhatsApp and call for every lead</li></ul></div><div class="by">Built on Pucho · pucho.ai</div></div>'
 +'<div class="lf"><div class="lc"><div><h3>Sign in</h3><p>Demo: pick a persona to enter. No password is needed on the demo.</p></div><div class="pers">'+ROLES.map(r=>'<button onclick="S.me=\''+r.id+'\';go(\'home\')"><div class="av">'+r.ini+'</div><div><b>'+esc(r.n)+'</b><small>'+esc(r.d)+'</small></div>'+ic('arrow')+'</button>').join('')+'</div><p class="fine">The live build signs people in with email and password, managed on Users &amp; roles.</p></div></div></div>'}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&(S.open||S.modal||S.menu||S.side)){S.open=null;S.modal=null;S.menu=false;S.side=false;R()}});
R();
</script>
